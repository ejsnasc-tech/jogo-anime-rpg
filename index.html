(function () {

    d.style.cssText = 'position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:99999;background:#f5c542;color:#10192b;font:bold 15px Arial;padding:10px 16px;border-radius:14px;box-shadow:0 4px 14px #0008;max-width:90vw;text-align:center';
    d.textContent = '🔄 Nova versão do jogo! Toque aqui para atualizar'; d.onclick = function () { go(v); }; document.body.appendChild(d);
  }
  function chk() {

      if (!j.v || j.v === B) { first = false; return; }
      var done = null; try { done = sessionStorage.getItem('upd_done'); } catch (e) {}

  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) chk(); });
})();
</script>
